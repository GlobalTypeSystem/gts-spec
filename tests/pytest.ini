[pytest]
minversion = 9.0
# Keep successful shared case subtests quiet even with -v; failures retain case context.
verbosity_subtests = 0
# HttpRunner generated test files location
testpaths =
python_files = test_*.py
python_classes = TestCase*
python_functions = test_*

# Output settings
addopts = -v --tb=short

# Custom markers
markers =
    unit: unit tests that do not require a running GTS server
