name: Validate Schemas

on:
  push:
    branches: [ main, examples/** ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install ajv-cli
      run: npm install -g ajv-cli

    - name: Validate schemas
      run: |
        echo "Validating all schema files..."

        # Compile all schemas together so cross-references can be resolved
        # The 0-prefixed reference schema loads first alphabetically
        set +e
        AJV_OUT="$(ajv compile -s "examples/*/types/*.schema.json" --strict=false 2>&1)"
        AJV_CODE=$?
        set -e

        if [ "$AJV_CODE" -eq 0 ]; then
          echo "OK: all schemas are valid"
          exit 0
        fi

        # If the only failures are "can't resolve reference", treat them as warnings.
        # This allows schemas to be validated syntactically even when external $ref targets
        # (or custom URI schemes) are intentionally not resolvable in CI. Every other
        # line must be an ajv per-schema status line; any other diagnostic fails.
        RESOLVE_ERROR="^error: (can't|cannot|can not) resolve reference"
        STATUS_LINE="^schema .* is (valid|invalid)$"
        UNRESOLVED="$(printf '%s\n' "$AJV_OUT" | grep -Ei "$RESOLVE_ERROR" || true)"
        OTHER="$(printf '%s\n' "$AJV_OUT" | grep -Eiv "$RESOLVE_ERROR" | grep -Ev "$STATUS_LINE" | grep . || true)"

        if [ -n "$UNRESOLVED" ] && [ -z "$OTHER" ]; then
          echo 'WARN: some $ref targets could not be resolved (allowed):'
          echo "$UNRESOLVED"
          exit 0
        fi

        echo "$AJV_OUT"
        echo "ERROR: schema validation failed (ajv exit code $AJV_CODE)"
        exit 1
